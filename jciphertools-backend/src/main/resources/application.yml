cipher:
  aes:
    cbc:
      # 32-byte (256-bit) AES key, Base64-encoded — override via env vars in production
      key: ${AES_CBC_KEY:c2VjcmV0S2V5Rm9yQWVzMjU2Qml0c0tleVZhbHVlISE=}
      # 16-byte IV, Base64-encoded
      iv: ${AES_CBC_IV:aW5pdFZlY3RvcjE2Qnl0ZQ==}
    gcm:
      # 32-byte (256-bit) AES key, Base64-encoded — override via env vars in production
      key: ${AES_GCM_KEY:3jIaFPkuyH6DYIyoFNykNaQBELjeQIbnXcbyxtG6BVU=}
      # 12-byte IV, Base64-encoded
      iv: ${AES_GCM_IV:hVa/GvGYHS5mTIi6}
    
  rsa:
    public-key-path: ${RSA_PUBLIC_KEY_PATH:keys/public_key.pem}
    private-key-path: ${RSA_PRIVATE_KEY_PATH:keys/private_key.pem}


cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}


server:
  port: 8081

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operations-sorter: method
    tags-sorter: alpha
  show-actuator: false