cipher:
  aes:
    cbc:
      # 32-byte (256-bit) AES key, Base64-encoded — override via env vars in production
      key: ${AES_CBC_KEY}
      # 16-byte IV, Base64-encoded
      iv: ${AES_CBC_IV}
    gcm:
      # 32-byte (256-bit) AES key, Base64-encoded — override via env vars in production
      key: ${AES_GCM_KEY}
      # 12-byte IV, Base64-encoded
      iv: ${AES_GCM_IV}
    
  rsa:
    public-key-path: ${RSA_PUBLIC_KEY_PATH}
    private-key-path: ${RSA_PRIVATE_KEY_PATH}


cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS}


server:
  port: ${SERVER_PORT:8081}

management:
  server:
    port: ${MANAGEMENT_PORT:8082}
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

info:
  app:
    name: ${spring.application.name}
    version: "@project.version@"
    description: Encryption/decryption API

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operations-sorter: method
    tags-sorter: alpha
  show-actuator: false

spring:
  application:
    name: JCipherTools Backend
  mvc:
    problemdetails:
      enabled: true
