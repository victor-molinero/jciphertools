services:
  backend:
    build:
      context: ./jciphertools-backend
      dockerfile: Dockerfile
    image: ${BACKEND_IMAGE:-jciphertools-backend:local}
    container_name: jciphertools-backend
    ports:
      - "8081:8081"
      - "8082:8082"
    environment:
      AES_CBC_KEY: ${AES_CBC_KEY:-}
      AES_CBC_IV: ${AES_CBC_IV:-}
      AES_GCM_KEY: ${AES_GCM_KEY:-}
      AES_GCM_IV: ${AES_GCM_IV:-}
      RSA_PUBLIC_KEY_PEM: ${RSA_PUBLIC_KEY_PEM:-}
      RSA_PRIVATE_KEY_PEM: ${RSA_PRIVATE_KEY_PEM:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:4000,http://localhost:4200}
      SERVER_PORT: ${SERVER_PORT:-8081}
      MANAGEMENT_PORT: ${MANAGEMENT_PORT:-8082}

  frontend:
    build:
      context: ./jciphertools-frontend
      dockerfile: Dockerfile
    image: ${FRONTEND_IMAGE:-jciphertools-frontend:local}
    container_name: jciphertools-frontend
    depends_on:
      - backend
    environment:
      PORT: 4000
      API_BACKEND_URL: http://localhost:8081/api/v1
      NG_ALLOWED_HOSTS: localhost,127.0.0.1
    ports:
      - "4000:4000"