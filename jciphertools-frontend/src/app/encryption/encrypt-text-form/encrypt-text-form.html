<section class="cipher-card">
  <h1 class="title">JCipherTools</h1>

  <form [formGroup]="form" autocomplete="off">
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Algorithm</mat-label>
      <mat-select formControlName="algorithm">
        <mat-option *ngFor="let algo of algorithms" [value]="algo.value">{{ algo.label }}</mat-option>
      </mat-select>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Input</mat-label>
      <textarea
        matInput
        formControlName="input"
        rows="5"
        placeholder="Enter plain text to encrypt, or Base64 ciphertext to decrypt…"
      ></textarea>
      <mat-error>Input is required.</mat-error>
    </mat-form-field>

    <div class="actions">
      <button mat-raised-button color="primary" type="button" (click)="encrypt()" [disabled]="loading || form.invalid">
        {{ loading ? 'Processing…' : 'Encrypt' }}
      </button>
      <button mat-stroked-button color="accent" type="button" (click)="decrypt()" [disabled]="loading || form.invalid">
        {{ loading ? 'Processing…' : 'Decrypt' }}
      </button>
    </div>
  </form>

  <mat-form-field appearance="outline" class="full-width">
    <mat-label>Result</mat-label>
    <textarea matInput [value]="output" readonly rows="5"></textarea>
  </mat-form-field>

  <div class="error-message" *ngIf="errorMessage">
    {{ errorMessage }}
  </div>
</section>
